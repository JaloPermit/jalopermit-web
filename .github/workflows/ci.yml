name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "No package-lock.json yet"; fi
      - name: Lint
        run: |
          if npm run | grep -q " lint"; then npm run lint; else echo "No lint script yet"; fi
      - name: Test
        run: |
          if npm run | grep -q " test"; then npm test -- --watch=false; else echo "No test script yet"; fi
      - name: Build
        run: |
          if npm run | grep -q " build"; then npm run build; else echo "No build script yet"; fi
